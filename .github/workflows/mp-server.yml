# Deploys the multiplayer Cloudflare Worker.
# Disabled until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets exist.
name: Deploy multiplayer server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'src/mp/protocol.ts', 'src/mp/roomLogic.ts', 'src/mp/codes.ts', 'src/mp/names.ts', 'src/mp/rateLimit.ts']

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
